<!doctype html>
<html lang="zh-Hant">

<head>
    <title>會員註冊</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
</head>

<body>
    <header>
        <div w3-include-html="navbar.html"></div>
    </header>

    <main>
        <div class="container py-5">
            <form id="member_form">
                <div id="msg"></div>
                <div class="row mb-3">
                    <div class="col-12 text-center">
                        <h1>會員註冊</h1>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-3 text-start text-md-end pt-1">帳號</div>
                    <div class="col-9">
                        <input type="text" class="form-control" id="member_id" required />
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-3 text-start text-md-end pt-1">密碼</div>
                    <div class="col-9">
                        <input type="password" class="form-control" id="member_pw" required />
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-3 text-start text-md-end pt-1">確認密碼</div>
                    <div class="col-9">
                        <input type="password" class="form-control" id="member_pw_confirm" required />
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-3 text-start text-md-end pt-1">真實姓名</div>
                    <div class="col-9">
                        <input type="text" class="form-control" id="member_name" required />
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-3 text-start text-md-end pt-1">連絡電話</div>
                    <div class="col-9">
                        <input type="text" class="form-control" id="member_tel" required />
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-3 text-start text-md-end pt-1">送貨地址</div>
                    <div class="col-9">
                        <input type="text" class="form-control" id="member_address" required />
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-3 text-start text-md-end pt-1"></div>
                    <div class="col-9">
                        <button type="submit" class="btn btn-success" id="send">註冊</button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-dark">
        <div w3-include-html="footer.html"></div>
    </footer>


    <!-- Bootstrap JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>
    <script>
        // 引入外部檔案所必須使用的函數
        function includeHTML() {
            var z, i, elmnt, file, xhttp;
            /* Loop through a collection of all HTML elements: */
            z = document.getElementsByTagName("*");
            for (i = 0; i < z.length; i++) {
                elmnt = z[i];
                /*search for elements with a certain atrribute:*/
                file = elmnt.getAttribute("w3-include-html");
                if (file) {
                    /* Make an HTTP request using the attribute value as the file name: */
                    xhttp = new XMLHttpRequest();
                    xhttp.onreadystatechange = function () {
                        if (this.readyState == 4) {
                            if (this.status == 200) { elmnt.innerHTML = this.responseText; }
                            if (this.status == 404) { elmnt.innerHTML = "Page not found."; }
                            /* Remove the attribute, and call this function once more: */
                            elmnt.removeAttribute("w3-include-html");
                            includeHTML();
                        }
                    }
                    xhttp.open("GET", file, true);
                    xhttp.send();
                    /* Exit the function: */
                    return;
                }
            }
        }
        // 開始引入外部檔案
        includeHTML();
    </script>

    <!-- jQuery (local) -->
    <script src="/Tina_11/js/jquery-3.7.1.js"></script>
    <script>
        $(function () {
            console.log('jQuery OK');
        });
    </script>
    <script>
    $(function(){
        function showMsg(txt, type){
            $('#msg').html('<div class="alert alert-'+type+'" role="alert">'+txt+'</div>');
        }

        $('#member_form').on('submit', function(e){
            // 阻止表單預設送出行為
            e.preventDefault();

            var id = $('#member_id').val().trim();
            var pw = $('#member_pw').val();
            var pwc = $('#member_pw_confirm').val();

            if(!id || !pw){
                showMsg('請填寫帳號與密碼','danger'); return;
            }
            if(pw !== pwc){
                showMsg('密碼與確認密碼不一致','danger'); return;
            }

            var data = {
                member_id: id,
                member_pw: pw,
                member_name: $('#member_name').val().trim(),
                member_tel: $('#member_tel').val().trim(),
                member_address: $('#member_address').val().trim()
            };

            $('#send').prop('disabled', true);
            $.ajax({
                url: 'api/register.php',
                type: 'POST',
                data: data,
                dataType: 'json'
            }).done(function(res){
                if(res.msg == 'success'){
                    showMsg(res.message || '註冊成功','success');
                    // setTimeout(function(){ location.href = 'login.php'; }, 3000);
                    // console.log(res);
                    window.location.href = 'login.html';
                } else {
                    showMsg((res && res.message) ? res.message : '註冊失敗','danger');
                }
            }).fail(function(){
                showMsg('帳號或密碼重複，請修改後重新註冊','danger');
            }).always(function(){
                $('#send').prop('disabled', false);
            });
        });
    });
    </script>
</body>

</html>
